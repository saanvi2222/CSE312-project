<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Whiteboard</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #1e1e2e; color: #eee; }
        #bar { display: flex; gap: 12px; align-items: center; padding: 8px 12px; background: #2a2a3d; flex-wrap: wrap; }
        .tool { padding: 4px 10px; border-radius: 6px; border: 1px solid #555; background: #3a3a50; color: #eee; cursor: pointer; }
        #textInput { position: absolute; z-index: 5; min-width: 160px; padding: 2px 4px; border: 2px dashed #0f766e; background: rgba(255,255,255,0.9); font-family: sans-serif; outline: none; }
        .tool.active { background: #0f766e; border-color: #0f766e; }
        .swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }
        #layout { display: flex; gap: 12px; padding: 12px; }
        /* The wrapper keeps the 16:9 board shape at any window size */
        #wrap { position: relative; flex: 1; aspect-ratio: 16 / 9; max-height: calc(100vh - 80px); }
        #canvas { width: 100%; height: 100%; background: #fff; border-radius: 6px; cursor: crosshair; display: block; }
        #cursors { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
        .cursor { position: absolute; transform: translate(-5px, -5px); white-space: nowrap; }
        .cursor .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
        .cursor .label { font-size: 12px; color: #fff; padding: 1px 5px; border-radius: 4px; margin-left: 4px; }
        #users { width: 180px; background: #2a2a3d; border-radius: 6px; padding: 10px; }
        #users h3 { margin: 0 0 8px; font-size: 14px; }
        #userList { list-style: none; padding: 0; margin: 0; font-size: 14px; }
    </style>
</head>
<body>
<div id="bar">
    <span>You are <b id="me">connecting...</b></span>
    <span id="status">connecting</span>
    <span>Color:</span>
    <div class="swatch" style="background:#000000" data-color="#000000"></div>
    <div class="swatch" style="background:#e53935" data-color="#e53935"></div>
    <div class="swatch" style="background:#1e88e5" data-color="#1e88e5"></div>
    <div class="swatch" style="background:#43a047" data-color="#43a047"></div>
    <input type="color" id="colorPicker" value="#000000">
    <span>Tool:</span>
    <button id="penBtn" class="tool active">✏️ Pen</button>
    <button id="eraserBtn" class="tool">🧽 Eraser</button>
    <button id="textBtn" class="tool">🔤 Text</button>
    <select id="textSize" title="Text size">
        <option value="16">Small</option>
        <option value="24" selected>Medium</option>
        <option value="40">Large</option>
    </select>
</div>

<div id="layout">
    <div id="wrap">
        <canvas id="canvas" width="1600" height="900"></canvas>
        <div id="cursors"></div>
        <input id="textInput" type="text" maxlength="200" placeholder="Type, then Enter" hidden>
    </div>
    <div id="users">
        <h3>On this board</h3>
        <ul id="userList"></ul>
    </div>
</div>

<script>
    const BOARD_W = 1600, BOARD_H = 900;
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    const cursorLayer = document.getElementById("cursors");
    const colorPicker = document.getElementById("colorPicker");
    const cursors = {};
    let myName = null;
    let currentColor = "#000000";
    let isDrawing = false;
    let lastX = null, lastY = null;
    const strokes = []; // every segment on the board, so we can redraw after an erase
    const texts = []; // every piece of text on the board
    let tool = "pen"; // "pen", "eraser" or "text"
    const ERASE_RADIUS = 20; // must be between 5 and 60 (checked in client.go)

    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/ws`);
    const statusEl = document.getElementById("status");
    ws.onopen = () => statusEl.textContent = "connected";
    ws.onclose = () => statusEl.textContent = "disconnected (refresh to reconnect)";

    function send(msg) {
        if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
    }

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        switch (data.messageType) {
            case "welcome":
                myName = data.username;
                document.getElementById("me").textContent = myName;
                break;
            case "init_strokes":
                data.strokes.forEach(s => addStroke(s));
                (data.texts || []).forEach(t => addText(t));
                break;
            case "drawing":
                addStroke(data);
                break;
            case "text": // someone placed text
                addText(data);
                break;
            case "erase": // someone (maybe someone else) erased part of the board
                eraseNear(data.x, data.y, data.radius);
                break;
            case "cursor":
                moveCursor(data.username, data.x, data.y);
                break;
            case "user_left":
                if (cursors[data.username]) {
                    cursors[data.username].remove();
                    delete cursors[data.username];
                }
                break;
            case "active_users_list":
                updateUserList(data.users);
                break;
        }
    };

    function toBoard(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: Math.round((e.clientX - rect.left) / rect.width * BOARD_W),
            y: Math.round((e.clientY - rect.top) / rect.height * BOARD_H),
        };
    }

    function drawLine(startX, startY, endX, endY, color) {
        ctx.strokeStyle = color;
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(endX, endY);
        ctx.stroke();
    }

    function addStroke(s) { // remember a segment and draw it
        strokes.push(s);
        drawLine(s.startX, s.startY, s.endX, s.endY, s.color);
    }

    function drawText(t) { // draws text with its top-left corner at (x, y)
        ctx.font = `${t.size}px sans-serif`;
        ctx.textBaseline = "top";
        ctx.fillStyle = t.color;
        ctx.fillText(t.text, t.x, t.y); // canvas text is never parsed as HTML
    }

    function addText(t) { // remember a piece of text and draw it
        texts.push(t);
        drawText(t);
    }

    function textNear(t, x, y, radius) { // same estimate as textNear in hub.go
        const width = [...t.text].length * t.size * 0.6;
        const closestX = Math.max(t.x, Math.min(x, t.x + width));
        const closestY = Math.max(t.y, Math.min(y, t.y + t.size));
        return Math.hypot(x - closestX, y - closestY) <= radius;
    }

    function distanceToSegment(px, py, ax, ay, bx, by) { // same math as distanceToSegment in hub.go
        const dx = bx - ax, dy = by - ay;
        const lengthSq = dx * dx + dy * dy;
        let t = 0;
        if (lengthSq > 0) {
            t = ((px - ax) * dx + (py - ay) * dy) / lengthSq;
            t = Math.max(0, Math.min(1, t));
        }
        return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
    }

    function eraseNear(x, y, radius) { // removes segments near (x, y) and redraws the board
        let removed = false;
        for (let i = strokes.length - 1; i >= 0; i--) {
            const s = strokes[i];
            if (distanceToSegment(x, y, s.startX, s.startY, s.endX, s.endY) <= radius) {
                strokes.splice(i, 1);
                removed = true;
            }
        }
        for (let i = texts.length - 1; i >= 0; i--) {
            if (textNear(texts[i], x, y, radius)) {
                texts.splice(i, 1);
                removed = true;
            }
        }
        if (removed) redraw();
    }

    function redraw() { // clear the canvas and draw every remaining segment
        ctx.clearRect(0, 0, BOARD_W, BOARD_H);
        strokes.forEach(s => drawLine(s.startX, s.startY, s.endX, s.endY, s.color));
        texts.forEach(t => drawText(t));
    }

    // ---------- Text tool ----------
    const textInput = document.getElementById("textInput");
    let textSpot = null; // board coordinates where the text will go

    function openTextInput(p) { // show a text box where the user clicked
        textSpot = p;
        textInput.style.left = (p.x / BOARD_W * 100) + "%";
        textInput.style.top = (p.y / BOARD_H * 100) + "%";
        textInput.value = "";
        textInput.hidden = false;
        setTimeout(() => textInput.focus(), 0);
    }

    function closeTextInput() {
        textInput.hidden = true;
        textSpot = null;
    }

    textInput.addEventListener("keydown", (e) => {
        if (e.key === "Escape") return closeTextInput();
        if (e.key !== "Enter") return;
        const content = textInput.value.trim();
        if (content && textSpot) {
            const t = {
                x: textSpot.x, y: textSpot.y, text: content, color: currentColor,
                size: Number(document.getElementById("textSize").value),
            };
            addText(t); // show it right away
            send({ messageType: "text", ...t });
        }
        closeTextInput();
    });
    textInput.addEventListener("blur", closeTextInput); // clicking away cancels

    canvas.addEventListener("mousedown", (e) => {
        if (tool === "text") { // the text tool places a text box instead of drawing
            e.preventDefault(); // keep focus from jumping back to the canvas
            openTextInput(toBoard(e));
            return;
        }
        isDrawing = true;
        const p = toBoard(e);
        lastX = p.x; lastY = p.y;
    });

    function stopDrawing() {
        isDrawing = false;
        lastX = lastY = null;
    }
    canvas.addEventListener("mouseup", stopDrawing);
    canvas.addEventListener("mouseleave", stopDrawing);

    let lastCursorSent = 0;
    canvas.addEventListener("mousemove", (e) => {
        const p = toBoard(e);

        const now = Date.now();
        if (now - lastCursorSent >= 30) {
            lastCursorSent = now;
            send({ messageType: "cursor", x: p.x, y: p.y });
        }

        if (isDrawing && tool === "eraser") {
            eraseNear(p.x, p.y, ERASE_RADIUS); // erase locally right away
            send({ messageType: "erase", x: p.x, y: p.y, radius: ERASE_RADIUS });
        } else if (isDrawing) {
            const seg = { startX: lastX, startY: lastY, endX: p.x, endY: p.y, color: currentColor };
            addStroke(seg);
            send({ messageType: "drawing", ...seg });
            lastX = p.x; lastY = p.y;
        }
    });

    function colorFor(name) {
        let h = 0;
        for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360;
        return `hsl(${h}, 70%, 45%)`;
    }

    function moveCursor(user, x, y) {
        if (!cursors[user]) {
            const el = document.createElement("div");
            el.className = "cursor";
            const dot = document.createElement("span");
            dot.className = "dot";
            dot.style.background = colorFor(user);
            const label = document.createElement("span");
            label.className = "label";
            label.style.background = colorFor(user);
            label.textContent = user;
            el.append(dot, label);
            cursorLayer.appendChild(el);
            cursors[user] = el;
        }
        cursors[user].style.left = (x / BOARD_W * 100) + "%";
        cursors[user].style.top = (y / BOARD_H * 100) + "%";
    }

    function updateUserList(users) {
        const list = document.getElementById("userList");
        list.replaceChildren();
        users.forEach(u => {
            const li = document.createElement("li");
            li.textContent = u === myName ? `${u} (you)` : u;
            li.style.color = colorFor(u);
            list.appendChild(li);
        });
    }

    function setColor(color) {
        currentColor = color;
        colorPicker.value = color;
    }
    document.querySelectorAll(".swatch").forEach(s =>
        s.addEventListener("click", () => setColor(s.dataset.color)));
    colorPicker.addEventListener("input", (e) => currentColor = e.target.value);

    function setTool(newTool) { // switch between pen and eraser
        tool = newTool;
        document.getElementById("penBtn").classList.toggle("active", tool === "pen");
        document.getElementById("eraserBtn").classList.toggle("active", tool === "eraser");
        document.getElementById("textBtn").classList.toggle("active", tool === "text");
        canvas.style.cursor = tool === "eraser" ? "cell" : tool === "text" ? "text" : "crosshair";
    }
    document.getElementById("penBtn").addEventListener("click", () => setTool("pen"));
    document.getElementById("eraserBtn").addEventListener("click", () => setTool("eraser"));
    document.getElementById("textBtn").addEventListener("click", () => setTool("text"));
</script>
</body>
</html>
